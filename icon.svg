<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Meal Planner icon: the app's rose, a cream plate, a sage sprig. Full square (iOS / Android round the corners themselves). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d4949f"/>
      <stop offset="1" stop-color="#a15d6c"/>
    </linearGradient>
    <radialGradient id="glow" cx=".28" cy=".22" r=".7">
      <stop offset="0" stop-color="#fbe9ea" stop-opacity=".45"/>
      <stop offset="1" stop-color="#fbe9ea" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fa898"/>
      <stop offset="1" stop-color="#5f786a"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>
  <!-- plate -->
  <circle cx="256" cy="262" r="158" fill="#7e4252" opacity=".22"/>
  <circle cx="256" cy="252" r="158" fill="#fffdfb"/>
  <circle cx="256" cy="252" r="116" fill="#f6ece8"/>
  <circle cx="256" cy="252" r="116" fill="none" stroke="#ecdfdc" stroke-width="4"/>
  <!-- sprig -->
  <g transform="rotate(-38 256 252)">
    <path d="M256 340 C256 300 256 220 256 164" stroke="#5f786a" stroke-width="7" stroke-linecap="round" fill="none"/>
    <path d="M256 168 C232 186 230 214 256 236 C282 214 280 186 256 168 Z" fill="url(#leaf)"/>
    <path d="M254 268 C228 270 206 254 198 226 C226 222 248 236 254 268 Z" fill="url(#leaf)"/>
    <path d="M258 268 C284 270 306 254 314 226 C286 222 264 236 258 268 Z" fill="url(#leaf)"/>
    <path d="M254 312 C230 316 210 302 200 278 C226 272 248 286 254 312 Z" fill="url(#leaf)" opacity=".9"/>
    <path d="M258 312 C282 316 302 302 312 278 C286 272 264 286 258 312 Z" fill="url(#leaf)" opacity=".9"/>
  </g>
</svg>
