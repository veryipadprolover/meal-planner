<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Meal Planner">
<title>Meal Planner</title>
<!-- home screen icon (user): rose square, cream plate, sage sprig; the app writes the same links when it replaces this page -->
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
/* the same look as the app (user): its colours, serif italic name, soft background; light / dark / the app's ⚙ choice */
:root { --bg: #f6f1ee; --bg-a: #f9e6e3; --bg-b: #ebe7f4; --panel: #fffdfb; --panel2: #faf5f2; --text: #3a2f34; --muted: #94848b; --line: #ecdfdc;
  --accent: #b46f7d; --accent-ink: #fff; --accent-soft: #f6e4e7; --shadow: 0 8px 28px rgba(120, 70, 85, .12);
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif; color-scheme: light; }
:root[data-theme="dark"] { --bg: #1c191d; --bg-a: #2a2026; --bg-b: #211f2b; --panel: #272228; --panel2: #2e292f; --text: #f2e9eb; --muted: #a5969d; --line: #3c353b;
  --accent: #e3a3ae; --accent-ink: #241d22; --accent-soft: #3d2f37; --shadow: 0 8px 28px rgba(0, 0, 0, .45); color-scheme: dark; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #1c191d; --bg-a: #2a2026; --bg-b: #211f2b; --panel: #272228; --panel2: #2e292f; --text: #f2e9eb; --muted: #a5969d; --line: #3c353b;
  --accent: #e3a3ae; --accent-ink: #241d22; --accent-soft: #3d2f37; --shadow: 0 8px 28px rgba(0, 0, 0, .45); color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px; color: var(--text); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  background: radial-gradient(60% 45% at 0% 0%, var(--bg-a), transparent 70%) fixed, radial-gradient(60% 45% at 100% 100%, var(--bg-b), transparent 70%) fixed, var(--bg); }
/* one soft card in the middle (user): name, spinner, text, even spaces */
.box { width: min(290px, 100%); display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 34px 26px 30px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow); }
.box:has(#setup:not([hidden])) { width: min(400px, 100%); }     /* the Dropbox steps need room */
.box .box { width: 100%; padding: 0; background: none; border: 0; box-shadow: none; border-radius: 0; }
h1 { margin: 0 0 2px; font: italic 400 30px/1.1 var(--serif); letter-spacing: .3px; text-align: center; }
.spin { width: 26px; height: 26px; border-radius: 50%; border: 2.5px solid var(--accent-soft); border-top-color: var(--accent); animation: spin .9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
#msg { margin: 0; max-width: 280px; text-align: center; color: var(--muted); font-size: 13px; line-height: 1.55; }
#setup { align-items: stretch; gap: 16px; padding-top: 16px !important; border-top: 1px solid var(--line) !important; }
label { display: flex; flex-direction: column; gap: 7px; font-size: 13px; font-weight: 600; }
input { font: inherit; font-weight: 400; width: 100%; min-width: 0; height: 40px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel2); color: var(--text); padding: 0 12px; }
input:focus { outline: none; border-color: var(--accent); }
button { font: inherit; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel2); color: var(--text); padding: 0 16px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
a { color: var(--accent); font-size: 13px; text-align: center; }
.row { display: flex; gap: 8px; } .row input { flex: 1; }
[hidden] { display: none !important; }
small { color: var(--muted); font-size: 12px; line-height: 1.5; text-align: center; }
</style>
<script>try { var t = localStorage.getItem('meal-planner.theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
</head>
<body>
<div class="box">
  <h1>Meal Planner</h1>
  <div class="spin" id="spin"></div>
  <p id="msg" hidden>Проверяю обновление…</p>
  <div class="box" id="setup" hidden>
    <label>1. App key (Dropbox App Console → Settings)<input id="key" spellcheck="false" autocomplete="off"></label>
    <button id="open">2. Открыть Dropbox → Allow</button>
    <a id="openLink" target="_blank" rel="noopener" hidden>Ничего не открылось? Нажмите здесь.</a>
    <label>3. Вставьте код из Dropbox<span class="row"><input id="code" spellcheck="false" autocomplete="off"><button class="primary" id="connect">Подключить</button></span></label>
    <small>Один раз. Потом эта страница сама берёт новую версию приложения из вашего Dropbox.</small>
  </div>
  <button id="retry" hidden>Ещё раз</button>
</div>
<script>
// Loader for Meal Planner: the web page for phone and iPad (GitHub Pages). It never changes: each time it opens,
// it asks Dropbox (the app folder) for the newest meal-planner.html, keeps a copy in this browser and
// opens it in this page. No internet: the kept copy opens. A new version that does not start (two
// tries) is left for the last good one. The Dropbox connection is the app's own (IndexedDB
// 'meal-planner', key 'dropbox'). Everything is inside this function: the app runs in this same page.
(function () {
  'use strict';
  var APP = '/meal-planner.html';
  var LS = 'meal-planner.';
  var SCOPES = 'files.metadata.read files.content.read files.content.write';
  var $ = function (s) { return document.querySelector(s); };
  // busy = only the spinner (user: no long text under it); the text shows only when something needs the user
  function say(t, busy) { $('#msg').textContent = t; $('#msg').hidden = !!busy; $('#spin').hidden = !busy; }
  function lsGet(k) { try { return localStorage.getItem(LS + k); } catch (e) { return null; } }
  function lsSet(k, v) { try { if (v == null) localStorage.removeItem(LS + k); else localStorage.setItem(LS + k, String(v)); } catch (e) {} }
  // The web page (https) keeps itself for offline use.
  if (location.protocol === 'https:' && 'serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});

  function openDb(name) {
    return new Promise(function (res, rej) {
      var r = indexedDB.open(name, 1);
      r.onupgradeneeded = function () { r.result.createObjectStore('kv'); };
      r.onsuccess = function () { res(r.result); }; r.onerror = function () { rej(r.error); };
    });
  }
  function dbGet(db, k) { return new Promise(function (res) { var q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = function () { res(q.result); }; q.onerror = function () { res(undefined); }; }); }
  function dbSet(db, k, v) { return new Promise(function (res, rej) { var t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = res; t.onerror = function () { rej(t.error); }; }); }

  var appDb, myDb, dbx;
  function errText(t, st) { try { var j = JSON.parse(t); return st + ': ' + (j.error_summary || j.error_description || JSON.stringify(j.error)); } catch (e) { return st + ': ' + (t || '').slice(0, 300); } }
  function withTimeout(p, ms) { return Promise.race([p, new Promise(function (_, rej) { setTimeout(function () { rej(new Error('Dropbox не отвечает')); }, ms); })]); }
  async function token() {
    if (dbx.access && dbx.exp > Date.now() + 60000) return dbx.access;
    var r = await fetch('https://api.dropboxapi.com/oauth2/token', { method: 'POST', body: new URLSearchParams({ grant_type: 'refresh_token', refresh_token: dbx.refresh, client_id: dbx.key }) });
    var t = await r.text();
    if (!r.ok) throw new Error('вход в Dropbox ' + errText(t, r.status));
    var j = JSON.parse(t); dbx.access = j.access_token; dbx.exp = Date.now() + (j.expires_in || 14400) * 1000;
    await dbSet(appDb, 'dropbox', dbx);
    return dbx.access;
  }
  async function rpc(name, arg) {
    return fetch('https://api.dropboxapi.com/2/' + name, { method: 'POST', headers: { Authorization: 'Bearer ' + await token(), 'Content-Type': 'application/json' }, body: JSON.stringify(arg) });
  }
  function run(app, info) {
    try { appDb.close(); myDb.close(); } catch (e) {}
    window.MP_STARTER = info;
    document.open(); document.write(app.html); document.close();
  }

  async function main() {
    $('#setup').hidden = true; $('#retry').hidden = true; say('Проверяю обновление…', true);
    try { appDb = await openDb('meal-planner'); myDb = await openDb('meal-planner-starter'); }
    catch (e) { say('Этот браузер не даёт хранить данные: ' + e.message); return; }
    dbx = await dbGet(appDb, 'dropbox');
    var app = await dbGet(myDb, 'app'), prev = await dbGet(myDb, 'prev');
    var good = lsGet('starterGood'), tryRev = lsGet('starterTry'), tries = +(lsGet('starterTries') || 0);
    var msg = '';
    if (!dbx || !dbx.refresh) {
      if (app) { run(app, { rev: app.rev, msg: 'Dropbox не подключён: без обновлений.' }); return; }
      showSetup(); return;
    }
    try {
      var m = await withTimeout(rpc('files/get_metadata', { path: APP }), 8000), mt = await m.text();
      if (m.status === 409 && mt.indexOf('not_found') >= 0) throw new Error('в Dropbox ещё нет приложения (запустите помощник на ПК)');
      if (!m.ok) throw new Error(errText(mt, m.status));
      var rev = JSON.parse(mt).rev;
      if (!app || app.rev !== rev) {
        say('Загружаю новую версию…', true);
        var l = await rpc('files/get_temporary_link', { path: APP }), lt = await l.text();
        if (!l.ok) throw new Error(errText(lt, l.status));
        var g = await fetch(JSON.parse(lt).link);
        if (!g.ok) throw new Error('загрузка ' + g.status);
        var html = await g.text();
        if (html.indexOf('<meta name="meal-planner-app"') < 0) throw new Error('файл в Dropbox — не приложение');
        if (app && app.rev === good) { prev = app; await dbSet(myDb, 'prev', prev); }
        app = { rev: rev, html: html, at: Date.now() };
        await dbSet(myDb, 'app', app);
      }
    } catch (e) {
      console.warn('starter', e);
      if (!app) { say('Не получилось загрузить приложение: ' + e.message); $('#retry').hidden = false; return; }
      msg = 'Без проверки обновления: ' + e.message;
    }
    if (app.rev !== good) {
      if (tryRev !== app.rev) { tryRev = app.rev; tries = 0; }
      if (tries >= 2 && prev && prev.rev === good) { run(prev, { rev: prev.rev, msg: 'Новая версия не запустилась. Открыта прошлая.' }); return; }
      lsSet('starterTry', tryRev); lsSet('starterTries', tries + 1);
    }
    run(app, { rev: app.rev, msg: msg });
  }

  var auth = null;
  function b64url(buf) { return btoa(String.fromCharCode.apply(null, new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
  async function prepare() {
    try { auth = JSON.parse(lsGet('dropboxAuth') || 'null'); } catch (e) { auth = null; }
    if (auth) return;
    var abc = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~', v = '';
    var rnd = crypto.getRandomValues(new Uint8Array(64));
    for (var i = 0; i < rnd.length; i++) v += abc[rnd[i] % abc.length];
    var c = v, md = 'plain';
    try { if (crypto.subtle) { c = b64url(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(v))); md = 'S256'; } } catch (e) {}
    auth = { v: v, c: c, m: md }; lsSet('dropboxAuth', JSON.stringify(auth));
  }
  function showSetup() { say('Подключите Dropbox один раз.'); $('#key').value = lsGet('dropboxKey') || ''; $('#setup').hidden = false; prepare(); }
  $('#open').onclick = function () {
    var key = $('#key').value.trim();
    if (!key) { say('Сначала вставьте App key.'); return; }
    if (!auth) { say('Секунду, нажмите ещё раз.'); return; }
    lsSet('dropboxKey', key);
    var url = 'https://www.dropbox.com/oauth2/authorize?' + new URLSearchParams({ client_id: key, response_type: 'code', token_access_type: 'offline', code_challenge: auth.c, code_challenge_method: auth.m, scope: SCOPES });
    var a = $('#openLink'); a.href = url; a.hidden = false;
    try { window.open(url, '_blank'); } catch (e) {}
    say('В Dropbox: Continue → Allow. Скопируйте код и вернитесь сюда.');
  };
  $('#connect').onclick = async function () {
    var key = $('#key').value.trim(), code = $('#code').value.trim();
    if (!key || !code || !auth) { say('Сначала шаги 1 и 2, потом код.'); return; }
    say('Подключаю…', true);
    try {
      var r = await fetch('https://api.dropboxapi.com/oauth2/token', { method: 'POST', body: new URLSearchParams({ code: code, grant_type: 'authorization_code', code_verifier: auth.v, client_id: key }) });
      var t = await r.text();
      if (!r.ok) throw new Error(errText(t, r.status));
      var j = JSON.parse(t);
      if (!j.refresh_token) throw new Error('Dropbox не дал refresh token');
      await dbSet(appDb, 'dropbox', { key: key, refresh: j.refresh_token, access: j.access_token, exp: Date.now() + (j.expires_in || 14400) * 1000, rev: '' });
      lsSet('dropboxAuth', null);
      main();
    } catch (e) { say('Не подключено: ' + e.message); }
  };
  $('#retry').onclick = main;
  main();
})();
</script>
</body>
</html>
